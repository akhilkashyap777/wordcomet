<!DOCTYPE html>
<html>
<head>
    <title>WordComet Mentorship</title>
    <link rel="stylesheet" href="css/booking.css">
</head>
<body>

    <div id="topbarContainer"></div>

    <hr>

    <!-- ===================================================== -->
    <!-- MENTOR SECTION -->
    <!-- ===================================================== -->
    <div id="mentorSection" style="display:none;">

        <h2>Mentor Profile</h2>

        <div id="mentorProfileForm">

            <div>
                <label for="mentorFullName">Full Name</label>
                <input
                    type="text"
                    id="mentorFullName"
                    placeholder="Enter your full name"
                >
            </div>

            <br>

            <div>
                <label for="mentorDesignation">Domains / Designations</label>

                <div class="domain-multiselect" id="domainMultiselect">
                    <button type="button" id="domainDropdownButton">
                        <span id="selectedDomainsDisplay" class="selected-domains-display">
                            <span class="domain-placeholder">Select one or more domains</span>
                        </span>

                        <span class="domain-dropdown-arrow">▼</span>
                    </button>
                    <div id="domainCheckboxList" class="domain-checkbox-list">
                        <!-- Domain checkboxes are added by JavaScript -->
                    </div>
                </div>
            </div>

            <br>

            <div>
                <label for="mentorExperienceYears">Years of Experience</label>
                <input
                    type="number"
                    id="mentorExperienceYears"
                    placeholder="Example: 3"
                    min="0"
                >
            </div>

            <br>

            <div>
                <label for="mentorExperienceMonths">Additional Months</label>
                <input
                    type="number"
                    id="mentorExperienceMonths"
                    placeholder="Example: 6"
                    min="0"
                    max="11"
                >
            </div>

            <br>

            <div>
                <label for="mentorBio">Professional Bio</label>
                <textarea
                    id="mentorBio"
                    rows="5"
                    maxlength="1000"
                    placeholder="Describe your skills and mentoring experience"
                ></textarea>
            </div>

            <br>

            <div>
                <label for="mentorResume">Upload Resume</label>
                <input
                    type="file"
                    id="mentorResume"
                    accept=".pdf,.doc,.docx"
                >
            </div>

            <br>

            <button type="button" id="saveMentorProfileBtn">
                Save Mentor Profile
            </button>

        </div>

        <hr>

        <h2>Mentor Availability</h2>

        <div>
            <label>Availability Date</label>
            <input type="date" id="availabilityDate">
        </div>

        <br>

        <div>
            <label>Start Time</label>
            <input type="time" id="startTime">
        </div>

        <br>

        <div>
            <label>End Time</label>
            <input type="time" id="endTime">
        </div>

        <br>

        <div>
            <label>Slot Duration (Minutes)</label>
            <input type="number" id="slotDuration" readonly>
        </div>

        <br>

        <button id="createAvailabilityBtn">
            Create Availability
        </button>

        <hr>

        <h3>My Availability</h3>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Duration</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="availabilityTable">
                <!-- availability rows -->
            </tbody>
        </table>

    </div>

    <!-- ===================================================== -->
    <!-- MENTEE SECTION -->
    <!-- ===================================================== -->
    <div id="menteeSection" style="display:none;">

        <h2>Book Mentor Session</h2>

        <div>
            <label>Domain</label>

            <select id="domainDropdown">
                <option value="">Select Domain</option>
            </select>
        </div>

        <div>
            <label>Mentor</label>

            <select id="mentorDropdown">
                <option>Select Mentor</option>
            </select>
        </div>

        <br>

        <div>
            <label>Date</label>
            <input type="date" id="sessionDate">
        </div>

        <br>

        <button id="loadSlotsBtn">
            Load Slots
        </button>

        <hr>

        <h3>Available Slots</h3>

        <div>
            <label>Upload Resume</label>
            <input type="file" id="resumeFile" accept=".pdf,.doc,.docx">
        </div>

        <br>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>Start</th>
                    <th>End</th>
                    <th>Booked</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="slotsTable">
                <!-- slot rows -->
            </tbody>
        </table>

        <hr>

        <h3>My Bookings</h3>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>Mentor</th>
                    <th>Date</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Status</th>
                    <th>Join</th>
                    <th>Cancel</th>
                </tr>
            </thead>

            <tbody id="bookingsTable">
                <!-- booking rows -->
            </tbody>
        </table>

    </div>

    <!-- ===================================================== -->
    <!-- VIDEO CALL MODAL -->
    <!-- ===================================================== -->
    <div id="videoModal" style="display:none; border:1px solid black; padding:20px;">

        <h2>Mentorship Session</h2>

        <div>

            <video
                id="localVideo"
                autoplay
                muted
                playsinline
                width="300">
            </video>

            <video
                id="remoteVideo"
                autoplay
                playsinline
                width="300">
            </video>

        </div>

        <br>

        <button id="startCallBtn">
            Start Camera
        </button>

        <button id="muteBtn">
            Mute
        </button>

        <button id="cameraBtn">
            Camera Off
        </button>

        <button id="hangupBtn">
            End Call
        </button>

    </div>

</body>
<div id="toastContainer"></div>
<script>

console.log("BOOKING AUTH CHECK VERSION 1");

let token = localStorage.getItem("wc_id_token");

console.log("Current page:", window.location.href);
console.log("Token exists:", Boolean(token));
console.log("Token value:", token);
console.log("Stored user:", localStorage.getItem("wc_user"));

if (!token) {
    console.log("No token found. Redirecting to login.html");
    window.location.replace("login.html");
} else {
    console.log("Token found. Validating through /profile/me");
}

function showToast(message, type = "error") {
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");

    toast.className = `toast ${type}`;
    toast.textContent = message;
    container.appendChild(toast);

    setTimeout(() => {
        toast.remove();
    }, 3000);
}
const BASE_URL = "https://wordcomet.shyapsneon.tech";
let currentUser = JSON.parse(localStorage.getItem("wc_user") || "{}");

if (!token) {
    window.location.replace("login.html");
}

async function loadTopbar() {
    try {
        const response = await fetch("topbar.html");

        if (!response.ok) {
            throw new Error(
                `Could not load top bar. Status: ${response.status}`
            );
        }

        const topbarHtml = await response.text();

        document.getElementById("topbarContainer").innerHTML = topbarHtml;

        const activeLink = document.querySelector(
            '[data-page="booking"]'
        );

        if (activeLink) {
            activeLink.classList.add("active");
        }

        const logoutButton =
            document.getElementById("sharedLogoutBtn");

        if (logoutButton) {
            logoutButton.addEventListener("click", logout);
        }

    } catch (error) {
        console.error("Top-bar loading failed:", error);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    await loadTopbar();
    init();
});

async function init() {
    console.log("init() started");

    if (!token) {
        console.log("init(): token is missing");
        window.location.replace("login.html");
        return;
    }

    try {
        console.log("Calling /profile/me...");
        await loadProfile();
        console.log("Profile loaded successfully:", currentUser);
    } catch (err) {
        console.error("Profile validation failed:", err);

        localStorage.removeItem("wc_id_token");
        localStorage.removeItem("wc_user");

        console.log("Stored login data removed. Redirecting...");
        window.location.replace("login.html");
        return;
    }

    if (currentUser.role === "mentor") {
        document.getElementById("mentorSection").style.display = "block";

        await loadMentorDesignations();
        fillMentorProfile();
        loadMyAvailability();

        document.getElementById("saveMentorProfileBtn").onclick =
            saveMentorProfile;
    }

    if (currentUser.role === "mentee") {
        document.getElementById("menteeSection").style.display = "block";
        loadDomains();
        loadMentors();
        loadMyBookings();

        document.getElementById("domainDropdown").onchange = loadMentorsByDomain;
        document.getElementById("sessionDate").onblur = loadMentorsByDate;
    }

    document.getElementById("startTime").onchange = updateSlotDuration;
    document.getElementById("endTime").onchange = updateSlotDuration;
    const today = new Date();

    const localToday =
        today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0");

    document.getElementById("availabilityDate").min = localToday;

    document.getElementById("createAvailabilityBtn").onclick = createAvailability;
    document.getElementById("loadSlotsBtn").onclick = loadSlots;
}

async function api(url, options = {}) {
    const res = await fetch(BASE_URL + url, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
            ...(options.headers || {})
        }
    });

    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || "Request failed");
    }

    return res.json();
}

async function apiForm(url, options = {}) {
    const res = await fetch(BASE_URL + url, {
        ...options,
        headers: {
            "Authorization": `Bearer ${token}`,
            ...(options.headers || {})
        }
    });

    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || "Request failed");
    }

    return res.json();
}

async function loadProfile() {
    const user = await api("/profile/me");
    currentUser = user;

    localStorage.setItem("wc_user", JSON.stringify(user));
}

/* ---------------- MENTOR ---------------- */

async function loadMentorDesignations() {
    try {
        const data = await api("/mentor/domain/List");

        const checkboxList =
            document.getElementById("domainCheckboxList");

        checkboxList.innerHTML = "";

        data.domains.forEach(domain => {
            const label = document.createElement("label");
            label.className = "domain-checkbox-option";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.value = domain;
            checkbox.className = "mentor-designation-checkbox";

            checkbox.addEventListener("change", updateDomainButtonText);

            const text = document.createElement("span");
            text.textContent = domain;

            label.appendChild(checkbox);
            label.appendChild(text);
            checkboxList.appendChild(label);
        });

    } catch (err) {
        showToast(err.message);
    }
}

function updateDomainButtonText() {
    const selectedCheckboxes = Array.from(
        document.querySelectorAll(
            ".mentor-designation-checkbox:checked"
        )
    );

    const display =
        document.getElementById("selectedDomainsDisplay");

    display.innerHTML = "";

    if (selectedCheckboxes.length === 0) {
        display.innerHTML =
            `<span class="domain-placeholder">
                Select one or more domains
            </span>`;

        return;
    }

    selectedCheckboxes.forEach(checkbox => {
        const tag = document.createElement("span");
        tag.className = "selected-domain-tag";

        const name = document.createElement("span");
        name.textContent = checkbox.value;

        const remove = document.createElement("span");
        remove.className = "remove-domain-tag";
        remove.textContent = "×";
        remove.setAttribute("role", "button");
        remove.setAttribute("tabindex", "0");
        remove.setAttribute(
            "aria-label",
            `Remove ${checkbox.value}`
        );

        remove.addEventListener("click", event => {
            event.stopPropagation();

            checkbox.checked = false;
            updateDomainButtonText();
        });

        tag.appendChild(name);
        tag.appendChild(remove);
        display.appendChild(tag);
    });
}

document
    .getElementById("domainDropdownButton")
    .addEventListener("click", function () {
        document
            .getElementById("domainCheckboxList")
            .classList.toggle("show");
    });

document.addEventListener("click", function (event) {
    const multiselect =
        document.getElementById("domainMultiselect");

    if (!multiselect.contains(event.target)) {
        document
            .getElementById("domainCheckboxList")
            .classList.remove("show");
    }
});

function fillMentorProfile() {
    document.getElementById("mentorFullName").value =
        currentUser.full_name || "";

    const savedDesignations = (currentUser.designation || "")
        .split(",")
        .map(value => value.trim())
        .filter(Boolean);

    document
        .querySelectorAll(".mentor-designation-checkbox")
        .forEach(checkbox => {
            checkbox.checked =
                savedDesignations.includes(checkbox.value);
        });

    updateDomainButtonText();

    document.getElementById("mentorExperienceYears").value =
        currentUser.experience_years ?? "";

    document.getElementById("mentorExperienceMonths").value =
        currentUser.experience_months ?? "";

    document.getElementById("mentorBio").value =
        currentUser.bio || "";
}

async function saveMentorProfile() {
    try {
        const fullName =
            document.getElementById("mentorFullName").value.trim();

        const designation = Array.from(
            document.querySelectorAll(
                ".mentor-designation-checkbox:checked"
            )
        )
        .map(checkbox => checkbox.value)
        .join(",");

        const experienceYears =
            Number(document.getElementById("mentorExperienceYears").value);

        const experienceMonths =
            Number(document.getElementById("mentorExperienceMonths").value);

        const bio =
            document.getElementById("mentorBio").value.trim();

        if (!fullName) {
            showToast("Enter your full name");
            return;
        }

        if (!designation) {
            showToast("Select atleast one domain");
            return;
        }

        if (
            experienceYears < 0 ||
            experienceMonths < 0 ||
            experienceMonths > 11
        ) {
            showToast("Enter valid experience");
            return;
        }

        const formData = new FormData();

        formData.append("full_name", fullName);
        formData.append("designation", designation);
        formData.append("experience_years", experienceYears);
        formData.append("experience_months", experienceMonths);
        formData.append("bio", bio);

        const resumeInput = document.getElementById("mentorResume");

        if (resumeInput.files.length > 0) {
            formData.append("resume", resumeInput.files[0]);
        }

        const data = await apiForm("/profile/update", {
            method: "PUT",
            body: formData
        });

        currentUser = data.user || data;

        localStorage.setItem(
            "wc_user",
            JSON.stringify(currentUser)
        );

        showToast("Mentor profile updated successfully");

    } catch (err) {
        showToast(err.message);
    }
}

function updateSlotDuration() {
    const startTime = document.getElementById("startTime").value;
    const endTime = document.getElementById("endTime").value;
    const durationInput = document.getElementById("slotDuration");

    if (!startTime || !endTime) {
        durationInput.value = "";
        return;
    }

    const [startHour, startMinute] = startTime.split(":").map(Number);
    const [endHour, endMinute] = endTime.split(":").map(Number);

    const startTotal = startHour * 60 + startMinute;
    const endTotal = endHour * 60 + endMinute;
    const duration = endTotal - startTotal;

    durationInput.value = duration > 0 ? duration : "";
}

async function createAvailability() {
    try {
        const body = {
            availability_date: document.getElementById("availabilityDate").value,
            start_time: document.getElementById("startTime").value,
            end_time: document.getElementById("endTime").value,
            slot_duration_minutes: Number(document.getElementById("slotDuration").value)
        };

        await api("/mentor/availability", {
            method: "POST",
            body: JSON.stringify(body)
        });

        showToast("Availability created", "success");
        loadMyAvailability();

    } catch (err) {
        showToast(err.message);
    }
}

async function loadMyAvailability() {
    try {
        const data = await api("/mentor/availability/me");
        const tbody = document.getElementById("availabilityTable");
        tbody.innerHTML = "";

        data.availability.forEach(a => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${a.id}</td>
                <td>${a.availability_date}</td>
                <td>${formatTime(a.start_time)}</td>
                <td>${formatTime(a.end_time)}</td>
                <td>${a.slot_duration_minutes}</td>
                <td>${a.is_active ? "Active" : "Inactive"}</td>
                <td>
                    ${a.is_active
                        ? `<button onclick="disableAvailability(${a.id})">Disable</button>`
                        : "-"
                    }
                </td>
            `;

            tbody.appendChild(tr);
        });

    } catch (err) {
        showToast(err.message);
    }
}

async function disableAvailability(id) {
    try {
        await api(`/mentor/availability/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ is_active: false })
        });

        showToast("Availability disabled");
        loadMyAvailability();

    } catch (err) {
        showToast(err.message);
    }
}

/* ---------------- MENTEE ---------------- */

async function loadDomains() {
    try {
        const data = await api("/mentor/domain/List");

        const dropdown = document.getElementById("domainDropdown");

        dropdown.innerHTML = `<option value="">Select Domain</option>`;

        data.domains.forEach(domain => {
            const option = document.createElement("option");

            option.value = domain;
            option.textContent = domain;

            dropdown.appendChild(option);
        });

    } catch (err) {
        showToast(err.message);
    }
}

async function loadMentors() {
    try {
        const data = await api("/mentors");
        const dropdown = document.getElementById("mentorDropdown");
        dropdown.innerHTML = `<option value="">Select Mentor</option>`;

        data.mentors.forEach(m => {
            const option = document.createElement("option");
            option.value = m.id;
            option.textContent = `${m.display_name || m.full_name || "Mentor"} (${m.id})`;
            dropdown.appendChild(option);
        });

    } catch (err) {
        showToast(err.message);
    }
}

async function loadMentorsByDomain() {
    try {
        const designation = document.getElementById("domainDropdown").value;

        if (!designation) {
            loadMentors();
            return;
        }

        const data = await api(
            `/mentor/bydomain?designation=${encodeURIComponent(designation)}`
        );

        const dropdown = document.getElementById("mentorDropdown");
        dropdown.innerHTML = `<option value="">Select Mentor</option>`;

        data.mentors.forEach(m => {
            const option = document.createElement("option");

            option.value = m.id;
            option.textContent =
                `${m.display_name || m.full_name || "Mentor"} (${m.id})`;

            dropdown.appendChild(option);
        });

    } catch (err) {
        showToast(err.message);
    }
}

async function loadMentorsByDate() {
    try {
        const date = document.getElementById("sessionDate").value;

        if (!date) {
            loadMentors();
            return;
        }

        const data = await api(
            `/mentor/bydate?session_date=${encodeURIComponent(date)}`
        );

        const dropdown = document.getElementById("mentorDropdown");
        dropdown.innerHTML = `<option value="">Select Mentor</option>`;

        data.mentors.forEach(m => {
            const option = document.createElement("option");

            option.value = m.id;
            option.textContent =
                `${m.display_name || m.full_name || "Mentor"} (${m.id})`;

            dropdown.appendChild(option);
        });

    } catch (err) {
        showToast(err.message);
    }
}

async function loadSlots() {
    try {
        const mentorId = document.getElementById("mentorDropdown").value;
        const date = document.getElementById("sessionDate").value;

        if (!mentorId || !date) {
            showToast("Select mentor and date");
            return;
        }

        const data = await api(`/mentor/${mentorId}/slots?session_date=${date}`);
        const tbody = document.getElementById("slotsTable");
        tbody.innerHTML = "";

        data.slots.forEach(slot => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${slot.start_time}</td>
                <td>${slot.end_time}</td>
                <td>${slot.is_booked ? "Yes" : "No"}</td>
                <td>
                    ${slot.can_book
                        ? `<button onclick="bookSlot(${slot.mentor_id}, ${slot.availability_id}, '${slot.session_date}', '${slot.start_time}', '${slot.end_time}')">Book</button>`
                        : "Not available"
                    }
                </td>
            `;

            tbody.appendChild(tr);
        });

    } catch (err) {
        showToast(err.message);
    }
}

async function bookSlot(mentorId, availabilityId, sessionDate, startTime, endTime) {
    try {
        const resumeInput = document.getElementById("resumeFile");

        if (!resumeInput.files.length) {
            showToast("Please upload resume before booking");
            return;
        }

        const formData = new FormData();
        formData.append("mentor_id", mentorId);
        formData.append("availability_id", availabilityId);
        formData.append("session_date", sessionDate);
        formData.append("start_time", startTime);
        formData.append("end_time", endTime);
        formData.append("resume", resumeInput.files[0]);

        await apiForm("/mentor/bookings", {
            method: "POST",
            body: formData
        });

        showToast("Slot booked", "success");
        loadSlots();
        loadMyBookings();

    } catch (err) {
        showToast(err.message);
    }
}

async function loadMyBookings() {
    try {
        const bookingsData = await api("/mentor/bookings/all");

        const tbody = document.getElementById("bookingsTable");
        tbody.innerHTML = "";

        const allBookings = [
            ...(bookingsData.bookings?.active || []),
            ...(bookingsData.bookings?.upcoming || []),
            ...(bookingsData.bookings?.past || []),
            ...(bookingsData.bookings?.cancelled || [])
        ];

        allBookings.forEach(b => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${b.mentor_name || b.mentee_name || b.mentor_id}</td>
                <td>${b.session_date}</td>
                <td>${formatTime(b.start_time)}</td>
                <td>${formatTime(b.end_time)}</td>
                <td>${b.status}</td>
                <td>
                    <button onclick="prepareJoinCall('${b.video_room_id}')">
                        Join
                    </button>
                </td>
                <td>
                    ${b.status === "booked"
                        ? `<button onclick="cancelBooking(${b.id})">Cancel</button>`
                        : "Cancelled"
                    }
                </td>
            `;

            tbody.appendChild(tr);
        });

    } catch (err) {
        showToast(err.message);
    }
}

async function cancelBooking(id) {
    try {
        await api(`/mentor/bookings/${id}/cancel`, {
            method: "PATCH"
        });

        showToast("Booking cancelled", "success");
        await loadMyBookings();

    } catch (err) {
        showToast(err.message);
    }
}

/* ---------------- CALL PLACEHOLDER ---------------- */

function prepareJoinCall(videoRoomId) {
    localStorage.setItem("wc_video_room_id", videoRoomId);

    showToast("Room saved: " + videoRoomId + "\nNow connect this to your existing WebRTC code.");

    document.getElementById("videoModal").style.display = "block";

    // Later your existing WebRTC code should connect to:
    // ws://127.0.0.1:8011/mentor/ws/video/${videoRoomId}?token=${token}
}

/* ------------------ Logout ---------------- */

function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}

/* ---------------- HELPERS ---------------- */

function formatTime(value) {
    if (!value) return "";
    return String(value).slice(0, 5);
}
</script>
</html>
