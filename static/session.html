<div id="app">

    <main class="video-call-page">

                    <span class="nav-brand-icon">☄️</span>

                            Your Camera
                        </div>

                            id="localVideo"

                        <button

                        <button
                            id="screenShareBtn"

                            type="button"

                            <span id="screenShareLabel">Share</span>
                        </button>

                        <button
                            id="fullscreenBtn"
                            class="control-btn"
                            type="button">
                            <span class="control-icon">⛶</span>
                            <span id="fullscreenLabel">Full Screen</span>
                        </button>

                        <button
                            id="endCallBtn"
                            class="control-btn control-btn-danger"
                            type="button"
                            disabled>
                            <span class="control-icon">📞</span>
                            <span>End</span>
                        </button>

                    </div>
                </div>

            </div>

        </section>

        <section class="chat-panel">

            <h2>Chat</h2>

            <div id="chatMessages"></div>

            <div class="chat-input-row">

                <input
                    type="text"
                    id="chatInput"
                    placeholder="Type a message..."
                >

                <button
                    id="sendChatBtn"
                    type="button">
                    Send
                </button>

                <input
                    type="file"
                    id="chatFileInput"
                >

            </div>

        </section>

    </main>

</div>


<script type="module">

    projectId: "wordcomet",
    storageBucket: "wordcomet.firebasestorage.app",
    messagingSenderId: "218267654833",
    appId: "1:218267654833:web:1216a59da0632a89d7a090",
    measurementId: "G-NHRYJRJZ0G"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Change these for production
const API_BASE = "https://wordcomet.shyapsneon.tech";
// const WS_URL = `wss://wordcomet.shyapsneon.tech/ws/chat/${ROOM_ID}`;

let ROOM_ID = null;
let WS_URL = null;

let websocket;
let peerConnection;
let localStream;

let localVideo = document.getElementById("localVideo");
let remoteVideo = document.getElementById("remoteVideo");

const muteBtn = document.getElementById("muteBtn");
const chatMessages = document.getElementById("chatMessages");
const chatInput = document.getElementById("chatInput");
const sendChatBtn = document.getElementById("sendChatBtn");
const chatFileInput = document.getElementById("chatFileInput");
const cameraBtn = document.getElementById("cameraBtn");
const screenShareBtn = document.getElementById("screenShareBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const endCallBtn = document.getElementById("endCallBtn");

const muteLabel = document.getElementById("muteLabel");
const cameraLabel = document.getElementById("cameraLabel");
const screenShareLabel = document.getElementById("screenShareLabel");
const fullscreenLabel = document.getElementById("fullscreenLabel");

let screenStream = null;
let isScreenSharing = false;

async function start() {

    const idToken = localStorage.getItem("wc_id_token");

    const bookingResponse = await fetch(`${API_BASE}/mentor/bookings/me`, {
        headers: {
            Authorization: `Bearer ${idToken}`
        }
    });

    if (bookingResponse.status === 404) {
        document.getElementById("app").innerHTML = `
            <main class="no-booking-page">

                <div class="no-booking-logo">
                    <div class="no-booking-logo-icon">☄️</div>

                    <div class="no-booking-logo-text">
                        Word<span>Comet</span>
                    </div>
                </div>

                <section class="no-booking-card">

                    <div class="no-booking-icon">📅</div>

                    <h1>No Active Booking</h1>

                    <p class="no-booking-message">
                        You don't have any active mentor session right now.
                        Please return during your scheduled session.
                    </p>

                    <button id="retryBtn" class="join-call-btn">
                        Join Video Call Again
                    </button>

                </section>

            </main>
        `;

        document
            .getElementById("retryBtn")
            .addEventListener("click", start);

        return;
    }

    if (!bookingResponse.ok) {
        throw new Error("Failed to load booking.");
    }

    const bookingData = await bookingResponse.json();

    ROOM_ID = bookingData.bookings[0].video_room_id;

    WS_URL = `wss://wordcomet.shyapsneon.tech/ws/chat/${ROOM_ID}`;

    console.log("Room ID:", ROOM_ID);

    console.log("Fetching TURN credentials...");

    const turnResponse = await fetch(`${API_BASE}/turn-credentials`);
    const turnData = await turnResponse.json();

    console.log(turnData);

    peerConnection = new RTCPeerConnection({
        iceServers: turnData.iceServers
    });

    peerConnection.onicecandidate = (event) => {

        if (event.candidate) {

            websocket.send(JSON.stringify({
                type: "ice_candidate",
                candidate: event.candidate
            }));

        }

    };

    peerConnection.ontrack = (event) => {

        remoteVideo.srcObject = event.streams[0];

    };

    localStream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
    });

    localVideo.srcObject = localStream;
    muteBtn.disabled = false;
    cameraBtn.disabled = false;
    screenShareBtn.disabled = false;
    endCallBtn.disabled = false;

    localStream.getTracks().forEach(track => {

        peerConnection.addTrack(track, localStream);

    });

    connectWebSocket();

}

function connectWebSocket() {

    console.log("Connecting websocket...");

    websocket = new WebSocket(WS_URL);

    websocket.onopen = () => {

        console.log("Connected");

    };

    websocket.onclose = () => {

        console.log("Disconnected");

    };

    websocket.onerror = (e) => {

        console.log(e);

    };

    websocket.onmessage = async (event) => {

        const message = JSON.parse(event.data);

        console.log(message);

        switch (message.type) {

            case "joined":
                console.log("Joined room");
                break;

            case "peer_ready":

                if (message.should_create_offer) {

                    const offer = await peerConnection.createOffer();

                    await peerConnection.setLocalDescription(offer);

                    websocket.send(JSON.stringify({
                        type: "offer",
                        sdp: offer
                    }));

                }

                break;

            case "offer":

                await peerConnection.setRemoteDescription(
                    new RTCSessionDescription(message.sdp)
                );

                const answer = await peerConnection.createAnswer();

                await peerConnection.setLocalDescription(answer);

                websocket.send(JSON.stringify({
                    type: "answer",
                    sdp: answer
                }));

                break;

            case "answer":

                await peerConnection.setRemoteDescription(
                    new RTCSessionDescription(message.sdp)
                );

                break;

            case "ice_candidate":

                if (message.candidate) {

                    await peerConnection.addIceCandidate(
                        new RTCIceCandidate(message.candidate)
                    );

                }

                break;

            case "peer_left":

                console.log("Peer left");

                break;

            case "chat":

                chatMessages.innerHTML += `
                    <div>
                        <strong>Peer:</strong> ${message.message}
                    </div>
                `;

                chatMessages.scrollTop = chatMessages.scrollHeight;

                break;

            case "file":

                chatMessages.innerHTML += `
                    <div>
                        <strong>Peer sent:</strong>
                        <a href="${message.file_data}"
                        download="${message.file_name}">
                            ${message.file_name}
                        </a>
                    </div>
                `;

                chatMessages.scrollTop = chatMessages.scrollHeight;

                break;

            case "error":

                console.log(message.message);

                break;

        }

    };

}

muteBtn.addEventListener("click", () => {
    if (!localStream) {
        return;
    }

    const audioTrack = localStream.getAudioTracks()[0];

    if (!audioTrack) {
        return;
    }

    audioTrack.enabled = !audioTrack.enabled;

    muteLabel.textContent = audioTrack.enabled ? "Mute" : "Unmute";
    muteBtn.classList.toggle("control-btn-off", !audioTrack.enabled);
});

cameraBtn.addEventListener("click", () => {
    if (!localStream) {
        return;
    }

    const videoTrack = localStream.getVideoTracks()[0];

    if (!videoTrack) {
        return;
    }

    videoTrack.enabled = !videoTrack.enabled;

    cameraLabel.textContent = videoTrack.enabled
        ? "Camera"
        : "Camera Off";

    cameraBtn.classList.toggle(
        "control-btn-off",
        !videoTrack.enabled
    );
});

fullscreenBtn.addEventListener("click", async () => {
    const videoStage = document.querySelector(".main-video-frame");

    try {
        if (!document.fullscreenElement) {
            await videoStage.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        console.error("Fullscreen failed:", error);
    }
});

document.addEventListener("fullscreenchange", () => {
    fullscreenLabel.textContent = document.fullscreenElement
        ? "Exit Full"
        : "Full Screen";
});

screenShareBtn.addEventListener("click", async () => {
    if (!peerConnection || !localStream) {
        return;
    }

    if (isScreenSharing) {
        await stopScreenSharing();
        return;
    }

    try {
        screenStream =
            await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: false
            });

        const screenTrack = screenStream.getVideoTracks()[0];

        const sender = peerConnection
            .getSenders()
            .find(currentSender =>
                currentSender.track &&
                currentSender.track.kind === "video"
            );

        if (!sender) {
            throw new Error("Video sender was not found.");
        }

        await sender.replaceTrack(screenTrack);

        localVideo.srcObject = screenStream;

        isScreenSharing = true;
        screenShareLabel.textContent = "Stop Share";
        screenShareBtn.classList.add("control-btn-off");

        screenTrack.addEventListener("ended", () => {
            stopScreenSharing();
        });

    } catch (error) {
        console.error("Screen sharing failed:", error);
    }
});

async function stopScreenSharing() {
    if (!isScreenSharing || !localStream) {
        return;
    }

    const cameraTrack = localStream.getVideoTracks()[0];

    const sender = peerConnection
        .getSenders()
        .find(currentSender =>
            currentSender.track &&
            currentSender.track.kind === "video"
        );

    if (sender && cameraTrack) {
        await sender.replaceTrack(cameraTrack);
    }

    if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
    }

    localVideo.srcObject = localStream;

    isScreenSharing = false;
    screenShareLabel.textContent = "Share";
    screenShareBtn.classList.remove("control-btn-off");
}

endCallBtn.addEventListener("click", () => {
    if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
    }

    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
    }

    if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
    }

    if (websocket) {
        websocket.close();
        websocket = null;
    }

    localVideo.srcObject = null;
    remoteVideo.srcObject = null;

    muteBtn.disabled = true;
    cameraBtn.disabled = true;
    screenShareBtn.disabled = true;
    endCallBtn.disabled = true;

    muteLabel.textContent = "Mute";
    cameraLabel.textContent = "Camera";
    screenShareLabel.textContent = "Share";

    muteBtn.classList.remove("control-btn-off");
    cameraBtn.classList.remove("control-btn-off");
    screenShareBtn.classList.remove("control-btn-off");
});

sendChatBtn.addEventListener("click", async () => {

    const message = chatInput.value.trim();
    const file = chatFileInput.files[0];

    if (!message && !file) return;

    if (websocket.readyState !== WebSocket.OPEN) {
        alert("Chat is not connected.");
        return;
    }

    // Send selected file
    if (file) {

        const maxSize = 5 * 1024 * 1024;

        if (file.size > maxSize) {
            alert("File must be smaller than 5 MB.");
            return;
        }

        const fileData = await readFileAsDataURL(file);

        websocket.send(JSON.stringify({
            type: "file",
            file_name: file.name,
            file_type: file.type,
            file_data: fileData
        }));

        chatMessages.innerHTML += `
            <div>
                <strong>You sent:</strong>
                <a href="${fileData}" download="${file.name}">
                    ${file.name}
                </a>
            </div>
        `;

        chatFileInput.value = "";
    }

    // Send text message
    if (message) {

        websocket.send(JSON.stringify({
            type: "chat",
            message: message
        }));

        chatMessages.innerHTML += `
            <div>
                <strong>You:</strong> ${message}
            </div>
        `;

        chatInput.value = "";
    }

    chatMessages.scrollTop = chatMessages.scrollHeight;
});

function readFileAsDataURL(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);

        reader.readAsDataURL(file);
    });
}

document.getElementById("joinBtn").addEventListener("click", start);

document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

        if (localStream) {
            localStream
                .getTracks()
                .forEach(track => track.stop());
        }

        if (screenStream) {
            screenStream
                .getTracks()
                .forEach(track => track.stop());
        }

        if (peerConnection) {
            peerConnection.close();
        }

        if (websocket) {
            websocket.close();
        }

        localStorage.removeItem("wc_id_token");
        localStorage.removeItem("wc_user");
        localStorage.removeItem("wc_firebase_uid");

        await auth.signOut();

        window.location.href = "login.html";
    });
